name: Update current project

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/current-project.yml"
      - "scripts/detect_current_project.py"
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
    inputs:
      project:
        description: "Choose a project to pin, or select auto to resume commit detection"
        required: true
        type: choice
        default: auto
        options:
          - auto
          - MiniCloud
          - Harmoniq
          - Kavach Pay
          - WebThreatDetection
          - RogueSignal
          - LoopSpill
          - LoopSatellite

permissions:
  contents: write

concurrency:
  group: current-project-profile
  cancel-in-progress: false

jobs:
  detect-and-update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out profile repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Restore private detector state
        uses: actions/cache@v4
        with:
          path: .automation-state
          key: current-project-state-${{ github.run_id }}
          restore-keys: |
            current-project-state-

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Detect active project internally
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PROJECT_OVERRIDE: ${{ inputs.project }}
        run: python scripts/detect_current_project.py

