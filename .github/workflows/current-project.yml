name: Update current project

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
    inputs:
      project:
        description: "Choose a project to pin, or select auto to resume commit detection"
        required: true
        type: choice
        default: auto
        options:
          - auto
          - MiniCloud
          - Harmoniq
          - Kavach Pay
          - WebThreatDetection
          - RogueSignal
          - LoopSpill
          - LoopSatellite

permissions:
  contents: write

concurrency:
  group: current-project-profile
  cancel-in-progress: false

jobs:
  detect-and-update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out profile repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Detect active project and update profile
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PROJECT_OVERRIDE: ${{ inputs.project }}
        run: python scripts/detect_current_project.py

      - name: Commit profile changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md assets/profile-hero.svg .github/current-project-state.json
          if git diff --cached --quiet; then
            echo "No profile changes to publish."
            exit 0
          fi
          git commit -m "chore(profile): refresh currently building project"
          git push
