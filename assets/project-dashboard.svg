<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="260" viewBox="0 0 1000 260" role="img" aria-labelledby="t d">
<title id="t">Project portfolio dashboard</title><desc id="d">Animated portfolio overview showing independent builds, collaborative projects, backend systems, AI and security focus.</desc>
<defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#10100f"/><stop offset="1" stop-color="#070708"/></linearGradient><style>.m{font-family:Consolas,monospace}.u{font-family:Inter,Arial,sans-serif}.muted{fill:#aaa99f}.white{fill:#fafaf9}.tiny{font-size:9px;letter-spacing:1px}.card{fill:#151514;stroke:#4e4d44}.pulse{animation:pulse 1.8s ease-in-out infinite}@keyframes pulse{50%{opacity:.25}}@media(prefers-reduced-motion:reduce){.pulse{animation:none}}</style></defs>
<rect width="1000" height="260" rx="18" fill="url(#bg)"/><rect x="1" y="1" width="998" height="258" rx="17" fill="none" stroke="#4e4d44"/>
<text x="28" y="34" class="m tiny" fill="#8da697">02 / PROJECT FIELDNOTES</text><text x="972" y="34" text-anchor="end" class="m tiny muted">INDEPENDENT + COLLABORATIVE WORK</text>
<g><rect x="26" y="55" width="300" height="174" rx="12" class="card"/><rect x="26" y="55" width="300" height="5" rx="2" fill="#8da697"/><text x="48" y="88" class="m tiny" fill="#8da697">01 / INDEPENDENT</text><text x="48" y="122" class="u white" font-size="23" font-weight="800">MINICLOUD</text><text x="48" y="146" class="u muted" font-size="11">Distributed job execution</text><text x="48" y="164" class="u muted" font-size="11">Go · PostgreSQL · Workers</text><rect x="48" y="188" width="220" height="5" rx="2" fill="#383731"/><rect x="48" y="188" width="150" height="5" rx="2" fill="#8da697"><animate attributeName="width" values="90;190;90" dur="5s" repeatCount="indefinite"/></rect><text x="48" y="213" class="m" font-size="8" fill="#c9d8cc">FLAGSHIP SYSTEM</text><circle cx="295" cy="82" r="4" fill="#8da697" class="pulse"/></g>
<g><rect x="350" y="55" width="300" height="174" rx="12" class="card"/><rect x="350" y="55" width="300" height="5" rx="2" fill="#ed3426"/><text x="372" y="88" class="m tiny" fill="#ed3426">02 / INDEPENDENT</text><text x="372" y="122" class="u white" font-size="23" font-weight="800">HARMONIQ</text><text x="372" y="146" class="u muted" font-size="11">Music discovery &amp; playback</text><text x="372" y="164" class="u muted" font-size="11">Flask · JavaScript · Jamendo API</text><path d="M372 195h252" stroke="#383731"/><path d="M372 195h252" stroke="#ed3426" stroke-width="2" stroke-dasharray="10 10"><animate attributeName="stroke-dashoffset" values="0;-40" dur="2s" repeatCount="indefinite"/></path><text x="372" y="213" class="m" font-size="8" fill="#ff9b8d">LIVE WEB APPLICATION</text><circle cx="619" cy="82" r="4" fill="#ed3426" class="pulse"/></g>
<g><rect x="674" y="55" width="300" height="174" rx="12" class="card"/><rect x="674" y="55" width="300" height="5" rx="2" fill="#eda231"/><text x="696" y="88" class="m tiny" fill="#eda231">03 / TEAM BUILDS</text><text x="696" y="122" class="u white" font-size="23" font-weight="800">COLLABORATIVE</text><text x="696" y="146" class="u muted" font-size="11">Security · Fintech · Geospatial</text><text x="696" y="164" class="u muted" font-size="11">Games · Earth observation · AI</text><g transform="translate(696 190)"><rect width="42" height="19" rx="9" fill="#2b1b18"/><text x="21" y="13" class="m" font-size="8" fill="#ff9b8d" text-anchor="middle">KAVACH</text><rect x="49" width="46" height="19" rx="9" fill="#202d25"/><text x="72" y="13" class="m" font-size="8" fill="#c9d8cc" text-anchor="middle">WTD</text><rect x="102" width="51" height="19" rx="9" fill="#292820"/><text x="127" y="13" class="m" font-size="8" fill="#e7c98e" text-anchor="middle">LOOP</text></g><circle cx="943" cy="82" r="4" fill="#eda231" class="pulse"/></g>
</svg>