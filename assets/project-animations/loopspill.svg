<svg xmlns="http://www.w3.org/2000/svg" width="320" height="76" viewBox="0 0 320 76" role="img"><title>LoopSpill satellite oil spill source investigation</title><desc>A SAR-style ocean scene highlights a detected slick, traces a backward drift path and compares the estimated source with vessel AIS positions.</desc><rect width="320" height="76" rx="9" fill="#111110" stroke="#383731"/><rect x="9" y="9" width="104" height="58" rx="5" fill="#151c1b" stroke="#4E4D44"/><path d="M15 17q20 9 38 0t53 0M15 31q20 9 38 0t53 0M15 45q20 9 38 0t53 0M15 59q20 9 38 0t53 0" fill="none" stroke="#34433e" stroke-width="1"/><path d="M29 28c10-13 25 1 34-5s20 0 28 12-9 15-20 10-25 1-34-17z" fill="#ED3426" opacity=".7"><animate attributeName="opacity" values=".45;.85;.45" dur="2.5s" repeatCount="indefinite"/></path><path d="M75 42C112 55 128 17 165 30S204 50 232 25" fill="none" stroke="#8DA697" stroke-width="2" stroke-dasharray="4 4"><animate attributeName="stroke-dashoffset" values="0;-24" dur="1.6s" repeatCount="indefinite"/></path><circle cx="165" cy="30" r="4" fill="#EDA231"><animate attributeName="r" values="3;6;3" dur="1.4s" repeatCount="indefinite"/></circle><g transform="translate(252 34)"><path d="M-13 0h26l-5 9h-16z" fill="#8DA697"/><path d="M-5 0v-11h9V0" fill="#4E4D44" stroke="#EDA231"/><path d="M0-14v-4" stroke="#ED3426" stroke-width="2"/><path d="M-18 14h36" stroke="#4E4D44"/></g><path d="M232 25l7-4-1 8" fill="none" stroke="#EDA231" stroke-width="1.5"/><g font-family="Arial" font-size="7" fill="#aaa99f"><text x="125" y="13">BACKWARD DRIFT</text><text x="274" y="61">AIS MATCH</text><text x="18" y="63" fill="#fafaf9">SAR SLICK</text></g></svg>