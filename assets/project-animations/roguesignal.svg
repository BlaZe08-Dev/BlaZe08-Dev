<svg xmlns="http://www.w3.org/2000/svg" width="250" height="48" viewBox="0 0 250 48" role="img"><title>ROGUESIGNAL / MULTIPLAYER</title><desc>Small animated project-specific status visualization in a dark sage and red dashboard style.</desc><rect x="0.5" y="0.5" width="249" height="47" rx="8" fill="#111110" stroke="#383731"/><path d="M10 43H240" stroke="#292824" stroke-width="1"/><circle cx="42" cy="24" r="6" fill="#8DA697"/><circle cx="121" cy="24" r="6" fill="#ED3426"/><circle cx="200" cy="24" r="6" fill="#EDA231"/><circle cx="42" cy="24" r="15" fill="none" stroke="#8DA697" opacity=".6"><animate attributeName="r" values="9;19;9" dur="2s" repeatCount="indefinite"/><animate attributeName="opacity" values=".7;0;.7" dur="2s" repeatCount="indefinite"/></circle><path d="M48 24h67m12 0h67" stroke="#4E4D44" stroke-width="2" stroke-dasharray="4 5"><animate attributeName="stroke-dashoffset" values="0;-18" dur="1s" repeatCount="indefinite"/></path><path d="M121 8v32" stroke="#ED3426" stroke-width="1" stroke-dasharray="2 3" opacity=".7"/></svg>