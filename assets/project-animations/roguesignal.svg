<svg xmlns="http://www.w3.org/2000/svg" width="250" height="48" viewBox="0 0 250 48" role="img"><title>RogueSignal multiplayer social deduction</title><desc>Player positions, task locations and a proximity radius are visualized for a multiplayer social deduction game.</desc><rect width="250" height="48" rx="8" fill="#111110" stroke="#383731"/><rect x="9" y="7" width="105" height="34" rx="5" fill="#171715" stroke="#383731"/><path d="M18 14h87M18 22h87M18 30h87M35 10v28M62 10v28M88 10v28" stroke="#292824" stroke-width="1"/><circle cx="35" cy="24" r="4" fill="#8DA697"/><circle cx="80" cy="17" r="4" fill="#ED3426"/><circle cx="80" cy="17" r="13" fill="none" stroke="#ED3426" stroke-dasharray="3 3"><animate attributeName="r" values="8;16;8" dur="2s" repeatCount="indefinite"/><animate attributeName="opacity" values=".8;.2;.8" dur="2s" repeatCount="indefinite"/></circle><path d="M35 24L80 17" stroke="#EDA231" stroke-width="1.5" stroke-dasharray="3 3"/><g font-family="Arial" font-size="6" fill="#aaa99f"><text x="129" y="13">PLAYER PROXIMITY</text><text x="129" y="25">TASK / SABOTAGE</text><text x="129" y="37">MULTIPLAYER SESSION</text></g><circle cx="237" cy="11" r="3" fill="#8DA697"><animate attributeName="opacity" values="1;.2;1" dur="1.4s" repeatCount="indefinite"/></circle></svg>