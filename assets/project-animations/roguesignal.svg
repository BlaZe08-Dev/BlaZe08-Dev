<svg xmlns="http://www.w3.org/2000/svg" width="320" height="76" viewBox="0 0 320 76" role="img"><title>RogueSignal multiplayer social deduction scene</title><desc>A top-down arena map with player tokens, a task station and a pulsing proximity radius illustrating social deduction gameplay.</desc><rect width="320" height="76" rx="9" fill="#111110" stroke="#383731"/><rect x="10" y="9" width="183" height="58" rx="6" fill="#171715" stroke="#4E4D44"/><path d="M20 18h163v40H20zM75 18v40M130 18v40M20 38h163" fill="none" stroke="#292824" stroke-width="1.5"/><rect x="38" y="24" width="22" height="11" rx="2" fill="#292824" stroke="#8DA697"/><rect x="144" y="43" width="25" height="10" rx="2" fill="#292824" stroke="#EDA231"/><circle cx="91" cy="42" r="5" fill="#8DA697"/><circle cx="120" cy="30" r="5" fill="#ED3426"/><circle cx="120" cy="30" r="16" fill="none" stroke="#ED3426" stroke-width="1.2" stroke-dasharray="3 3"><animate attributeName="r" values="10;20;10" dur="2s" repeatCount="indefinite"/><animate attributeName="opacity" values=".9;.15;.9" dur="2s" repeatCount="indefinite"/></circle><path d="M91 42L120 30" stroke="#EDA231" stroke-dasharray="3 3" stroke-width="1.5"/><g font-family="Arial" font-size="7" fill="#aaa99f"><text x="210" y="20">MATCH STATUS</text><text x="210" y="34" fill="#8DA697">4–10 PLAYERS</text><text x="210" y="47">TASK / SABOTAGE</text><text x="210" y="60">PROXIMITY SIGNAL</text></g><circle cx="300" cy="17" r="3" fill="#8DA697"><animate attributeName="opacity" values="1;.2;1" dur="1.3s" repeatCount="indefinite"/></circle></svg>