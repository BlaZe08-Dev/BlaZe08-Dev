<svg xmlns="http://www.w3.org/2000/svg" width="320" height="76" viewBox="0 0 320 76" role="img"><title>LoopSatellite wetland observation</title><desc>A satellite passes over wetland channels, collects repeated water measurements and feeds a seasonal trend chart for anomaly review.</desc><rect width="320" height="76" rx="9" fill="#111110" stroke="#383731"/><rect x="10" y="10" width="126" height="56" rx="5" fill="#14201c" stroke="#4E4D44"/><path d="M16 20q18-10 32 0t32 0 48 0M16 33q18-10 32 0t32 0 48 0M16 46q18-10 32 0t32 0 48 0M16 59q18-10 32 0t32 0 48 0" fill="none" stroke="#39564b" stroke-width="3"/><path d="M16 27q18 8 32 0t32 0 48 0M16 53q18-8 32 0t32 0 48 0" fill="none" stroke="#8DA697" stroke-width="1.5"/><g transform="translate(74 29)"><rect x="-6" y="-5" width="12" height="10" rx="2" fill="#EDA231"/><path d="M-23-8h13v16h-13zM10-8h13v16H10z" fill="#4E4D44" stroke="#8DA697"/><path d="M-10 0h-13m23 0h13" stroke="#EDA231" stroke-width="1.5"/><animateTransform attributeName="transform" type="translate" values="35 29;111 29;35 29" dur="5s" repeatCount="indefinite"/></g><path d="M142 38h19m0 0-5-4m5 4-5 4" stroke="#ED3426" fill="none" stroke-width="1.5"/><rect x="166" y="10" width="144" height="56" rx="5" fill="#171715" stroke="#4E4D44"/><g font-family="Arial" font-size="7" fill="#aaa99f"><text x="176" y="21">WATER MEASUREMENTS</text><text x="176" y="60">SEASONAL TREND</text></g><path d="M177 51V27M177 51H299" stroke="#4E4D44"/><path d="M181 45l17-8 17 5 16-13 17 7 17-10 17 5 15-8" fill="none" stroke="#8DA697" stroke-width="2"/><circle cx="297" cy="23" r="3" fill="#ED3426"><animate attributeName="r" values="2;5;2" dur="1.5s" repeatCount="indefinite"/></circle><path d="M181 51H299" stroke="#EDA231" stroke-width="1" stroke-dasharray="2 5"/></svg>