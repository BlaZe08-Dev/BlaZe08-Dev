<svg xmlns="http://www.w3.org/2000/svg" width="250" height="48" viewBox="0 0 250 48" role="img"><title>LoopSatellite wetland monitoring</title><desc>A satellite scans a wetland area, producing repeated water measurements and a seasonal time-series signal.</desc><rect width="250" height="48" rx="8" fill="#111110" stroke="#383731"/><g font-family="Arial" font-size="6" fill="#aaa99f"><text x="12" y="9">SATELLITE PASS</text><text x="150" y="9">WATER TIME SERIES</text></g><g transform="translate(51 25)"><path d="M-6-4h12v8H-6z" fill="#8DA697"/><path d="M-23-8h13v16h-13zM10-8h13v16H10z" fill="#4E4D44" stroke="#EDA231" stroke-width="1"/><path d="M-10 0L-23 0M10 0l13 0" stroke="#EDA231" stroke-width="1.5"/><animateTransform attributeName="transform" type="translate" values="35 25;68 25;35 25" dur="4s" repeatCount="indefinite"/></g><path d="M25 39Q51 31 77 39" fill="none" stroke="#8DA697" stroke-width="2"/><path d="M83 14L115 38" stroke="#EDA231" stroke-width="1.2" stroke-dasharray="3 3"><animate attributeName="opacity" values="1;.2;1" dur="1.8s" repeatCount="indefinite"/></path><path d="M145 37V16M145 37H238" stroke="#4E4D44" stroke-width="1"/><path d="M148 31l15-8 14 5 14-13 15 8 15-5 15 4" fill="none" stroke="#8DA697" stroke-width="2"/><circle cx="221" cy="22" r="3" fill="#ED3426"><animate attributeName="r" values="2;4;2" dur="1.3s" repeatCount="indefinite"/></circle><path d="M145 37H238" stroke="#EDA231" stroke-width="1" stroke-dasharray="2 5"/></svg>