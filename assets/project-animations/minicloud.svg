<svg xmlns="http://www.w3.org/2000/svg" width="320" height="76" viewBox="0 0 320 76" role="img"><title>MiniCloud distributed execution visual</title><desc>A miniature distributed system scene: a terminal submits a job, coordinator dispatches to three worker machines, and results persist to PostgreSQL.</desc><defs><linearGradient id="mc" x2="0" y2="1"><stop stop-color="#1d2420"/><stop offset="1" stop-color="#111110"/></linearGradient></defs><rect width="320" height="76" rx="9" fill="#111110" stroke="#383731"/><g font-family="Arial" font-size="7" fill="#aaa99f"><text x="12" y="12">CLIENT</text><text x="91" y="12">COORDINATOR</text><text x="205" y="12">WORKER POOL</text><text x="281" y="12">STORE</text></g><rect x="10" y="20" width="48" height="42" rx="5" fill="#171715" stroke="#4E4D44"/><rect x="16" y="27" width="36" height="25" rx="2" fill="#070708"/><path d="M20 34l4 3-4 3m8 0h13" stroke="#8DA697" stroke-width="1.5" fill="none"/><path d="M21 56h25" stroke="#4E4D44" stroke-width="2"/><rect x="79" y="20" width="80" height="42" rx="5" fill="url(#mc)" stroke="#8DA697"/><circle cx="90" cy="30" r="3" fill="#ED3426"><animate attributeName="opacity" values="1;.25;1" dur="1.2s" repeatCount="indefinite"/></circle><path d="M100 30h48M89 40h59M89 49h40" stroke="#4E4D44" stroke-width="2"/><path d="M89 40h33" stroke="#8DA697" stroke-width="2"><animate attributeName="stroke-dasharray" values="0 50;33 50;0 50" dur="2s" repeatCount="indefinite"/></path><g fill="#171715" stroke="#8DA697"><rect x="187" y="23" width="30" height="34" rx="4"/><rect x="223" y="23" width="30" height="34" rx="4"/><rect x="259" y="23" width="30" height="34" rx="4"/></g><g fill="#8DA697"><circle cx="202" cy="31" r="2"/><circle cx="238" cy="31" r="2"/><circle cx="274" cy="31" r="2"/></g><g stroke="#4E4D44" stroke-width="2"><path d="M193 39h18m-18 5h18m-18 5h18M229 39h18m-18 5h18m-18 5h18M265 39h18m-18 5h18m-18 5h18"/></g><rect x="297" y="25" width="15" height="29" rx="3" fill="#171715" stroke="#EDA231"/><ellipse cx="304.5" cy="25" rx="7.5" ry="3" fill="#292824" stroke="#EDA231"/><path d="M297 34c0 4 15 4 15 0m-15 8c0 4 15 4 15 0" fill="none" stroke="#EDA231"/><g fill="none" stroke="#ED3426" stroke-width="1.6" stroke-dasharray="3 4"><path d="M58 41H79M159 41H187M159 41H223M159 41H259M289 41H297"><animate attributeName="stroke-dashoffset" values="0;-14" dur="1s" repeatCount="indefinite"/></path></g><circle r="3" fill="#ED3426"><animate attributeName="cx" values="60;78;60" dur="1.6s" repeatCount="indefinite"/><animate attributeName="cy" values="41;41;41" dur="1.6s" repeatCount="indefinite"/></circle></svg>