<svg xmlns="http://www.w3.org/2000/svg" width="250" height="48" viewBox="0 0 250 48" role="img"><title>MiniCloud distributed job execution</title><desc>A client submits a job to a coordinator, which dispatches work to worker processes and persists state in PostgreSQL.</desc><rect width="250" height="48" rx="8" fill="#111110" stroke="#383731"/><g font-family="Arial,sans-serif" font-size="6" fill="#aaa99f" text-anchor="middle"><text x="25" y="10">CLI</text><text x="91" y="10">COORDINATOR</text><text x="174" y="10">WORKERS</text><text x="225" y="10">DB</text></g><g fill="none" stroke="#8DA697" stroke-width="1.5"><rect x="8" y="15" width="34" height="23" rx="4"/><rect x="62" y="15" width="58" height="23" rx="4"/><rect x="145" y="15" width="58" height="23" rx="4"/><path d="M212 15h27v23h-27z" rx="3"/><path d="M42 26h20m58 0h25m58 0h9" stroke-dasharray="3 3"><animate attributeName="stroke-dashoffset" values="0;-12" dur="1s" repeatCount="indefinite"/></path></g><g fill="#ED3426"><circle r="3"><animate attributeName="cx" values="43;61;43" dur="1.6s" repeatCount="indefinite"/><animate attributeName="cy" values="26;26;26" dur="1.6s" repeatCount="indefinite"/></circle><circle r="3" fill="#EDA231"><animate attributeName="cx" values="121;144;121" dur="1.9s" repeatCount="indefinite"/><animate attributeName="cy" values="26;26;26" dur="1.9s" repeatCount="indefinite"/></circle></g><g fill="#8DA697"><circle cx="156" cy="22" r="2"/><circle cx="174" cy="22" r="2"/><circle cx="192" cy="22" r="2"/></g><path d="M217 21h17m-17 5h17m-17 5h12" stroke="#EDA231" stroke-width="1.3"/></svg>