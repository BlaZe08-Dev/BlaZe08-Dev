<svg xmlns="http://www.w3.org/2000/svg" width="320" height="76" viewBox="0 0 320 76" role="img"><title>Kavach Pay transaction risk analysis</title><desc>A simulated UPI collect request moves through signal checks and a deterministic risk engine, which produces an explainable decision.</desc><rect width="320" height="76" rx="9" fill="#111110" stroke="#383731"/><g font-family="Arial" font-size="7" fill="#aaa99f"><text x="13" y="13">PAYMENT REQUEST</text><text x="112" y="13">SIGNAL ANALYSIS</text><text x="238" y="13">RISK DECISION</text></g><rect x="12" y="20" width="66" height="45" rx="6" fill="#171715" stroke="#8DA697"/><rect x="20" y="27" width="50" height="24" rx="3" fill="#070708"/><path d="M25 34h39m-39 6h27" stroke="#8DA697" stroke-width="1.5"/><text x="45" y="60" text-anchor="middle" font-family="Arial" font-size="6" fill="#aaa99f">₹ REQUEST</text><path d="M78 42h20m0 0-5-4m5 4-5 4" stroke="#ED3426" fill="none" stroke-width="1.5"/><rect x="101" y="20" width="112" height="45" rx="6" fill="#171715" stroke="#4E4D44"/><g font-family="Arial" font-size="6" fill="#aaa99f"><text x="110" y="31">DEVICE SIGNAL</text><text x="110" y="42">PAYEE PATTERN</text><text x="110" y="53">REQUEST CONTEXT</text></g><g fill="#8DA697"><circle cx="194" cy="29" r="3"/><circle cx="194" cy="40" r="3"/><circle cx="194" cy="51" r="3"/></g><path d="M213 42h18m0 0-5-4m5 4-5 4" stroke="#ED3426" fill="none" stroke-width="1.5"/><rect x="234" y="20" width="74" height="45" rx="6" fill="#171715" stroke="#EDA231"/><circle cx="253" cy="42" r="11" fill="none" stroke="#4E4D44" stroke-width="3"/><circle cx="253" cy="42" r="11" fill="none" stroke="#ED3426" stroke-width="3" stroke-dasharray="34 70" stroke-linecap="round"><animateTransform attributeName="transform" type="rotate" from="-90 253 42" to="270 253 42" dur="4s" repeatCount="indefinite"/></circle><path d="M271 36h27m-27 8h22" stroke="#8DA697" stroke-width="1.5"/><circle r="3" fill="#ED3426"><animate attributeName="cx" values="80;99;80" dur="1.4s" repeatCount="indefinite"/><animate attributeName="cy" values="42;42;42" dur="1.4s" repeatCount="indefinite"/></circle></svg>