<svg xmlns="http://www.w3.org/2000/svg" width="250" height="48" viewBox="0 0 250 48" role="img"><title>WebThreatDetection evidence investigation</title><desc>Suspicious URL, message or QR evidence enters a scan pipeline, is analyzed and produces an integrity-checked report.</desc><rect width="250" height="48" rx="8" fill="#111110" stroke="#383731"/><g font-family="Arial" font-size="6" fill="#aaa99f" text-anchor="middle"><text x="35" y="10">URL / EMAIL / QR</text><text x="124" y="10">ANALYSIS</text><text x="214" y="10">REPORT</text></g><rect x="9" y="15" width="51" height="23" rx="4" fill="#1b1b19" stroke="#4E4D44"/><path d="M16 21h35m-35 5h28m-28 5h19" stroke="#8DA697" stroke-width="1.3"/><path d="M60 26h24m0 0-5-4m5 4-5 4" fill="none" stroke="#ED3426" stroke-width="1.5"/><circle cx="111" cy="26" r="13" fill="none" stroke="#4E4D44" stroke-width="2"/><path d="M111 13a13 13 0 0 1 13 13" fill="none" stroke="#ED3426" stroke-width="2.5"><animateTransform attributeName="transform" type="rotate" from="0 111 26" to="360 111 26" dur="2.2s" repeatCount="indefinite"/></path><path d="M98 26h26M111 13v26" stroke="#4E4D44" stroke-width="1"/><path d="M124 26h29m0 0-5-4m5 4-5 4" fill="none" stroke="#ED3426" stroke-width="1.5"/><rect x="158" y="15" width="83" height="23" rx="4" fill="#1b1b19" stroke="#8DA697"/><path d="M168 22l4 4 7-8" fill="none" stroke="#EDA231" stroke-width="1.6"/><path d="M185 21h46m-46 7h35" stroke="#8DA697" stroke-width="1.4"/><circle cx="234" cy="34" r="2" fill="#ED3426"><animate attributeName="opacity" values="1;.15;1" dur="1s" repeatCount="indefinite"/></circle></svg>