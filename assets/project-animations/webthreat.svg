<svg xmlns="http://www.w3.org/2000/svg" width="250" height="48" viewBox="0 0 250 48" role="img"><title>WEBTHREAT / THREAT SCAN</title><desc>Small animated project-specific status visualization in a dark sage and red dashboard style.</desc><rect x="0.5" y="0.5" width="249" height="47" rx="8" fill="#111110" stroke="#383731"/><path d="M10 43H240" stroke="#292824" stroke-width="1"/><circle cx="48" cy="24" r="15" fill="none" stroke="#4E4D44" stroke-width="2"/><circle cx="48" cy="24" r="15" fill="none" stroke="#8DA697" stroke-width="2" stroke-dasharray="18 76"><animateTransform attributeName="transform" type="rotate" from="0 48 24" to="360 48 24" dur="3s" repeatCount="indefinite"/></circle><path d="M48 9V39M33 24H63" stroke="#4E4D44"/><path d="M83 24h42m0 0-6-5m6 5-6 5" stroke="#ED3426" stroke-width="2" fill="none"/><path d="M153 13l12 22h-24z" fill="none" stroke="#ED3426" stroke-width="2"/><path d="M153 19v8m0 4v1" stroke="#EDA231" stroke-width="2" class="pulse"><animate attributeName="opacity" values="1;.2;1" dur="1s" repeatCount="indefinite"/></path><rect x="190" y="14" width="42" height="20" rx="4" fill="#26332d"/><circle cx="201" cy="24" r="3" fill="#8DA697"><animate attributeName="opacity" values="1;.2;1" dur=".9s" repeatCount="indefinite"/></circle><path d="M210 24h15" stroke="#8DA697" stroke-width="2"/></svg>