<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="650" viewBox="0 0 1000 650" role="img" aria-labelledby="t d">
<title id="t">MiniCloud — animated execution dashboard</title><desc id="d">Current MiniCloud v1.1.0 architecture displayed as a dark operations dashboard with animated job flow, worker heartbeats, durable storage and system status indicators.</desc>
<defs>
 <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#10100f"/><stop offset="1" stop-color="#070708"/></linearGradient><linearGradient id="sage" x2="1" y2="1"><stop stop-color="#8da697"/><stop offset="1" stop-color="#526d5d"/></linearGradient>
 <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#302f2b" stroke-width=".6"/></pattern>
 <filter id="glow" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
 <style>.mono{font-family:Consolas,monospace}.ui{font-family:Inter,Arial,sans-serif}.muted{fill:#aaa99f}.white{fill:#fafaf9}.tiny{font-size:10px;letter-spacing:1.1px}.card{fill:#151514;stroke:#4e4d44}.line{fill:none;stroke:#8da697;stroke-width:2;stroke-dasharray:6 8}.packet{fill:#eda231;filter:url(#glow)}.pulse{animation:pulse 1.7s ease-in-out infinite}.float{animation:float 4.5s ease-in-out infinite}@keyframes pulse{50%{opacity:.25}}@keyframes float{50%{transform:translateY(-3px)}}@media(prefers-reduced-motion:reduce){.pulse,.float{animation:none}}</style>
</defs>
<rect width="1000" height="650" rx="22" fill="url(#bg)"/><rect width="1000" height="650" rx="22" fill="url(#grid)" opacity=".5"/><rect x="1" y="1" width="998" height="648" rx="21" fill="none" stroke="#4e4d44"/>
<rect x="18" y="18" width="964" height="614" rx="16" fill="#0c0c0b" stroke="#383731"/><path d="M18 70H982" stroke="#383731"/>
<circle cx="45" cy="44" r="5" fill="#ed3426"/><circle cx="63" cy="44" r="5" fill="#eda231"/><circle cx="81" cy="44" r="5" fill="#8da697"/>
<text x="104" y="48" class="mono tiny white">MINICLOUD / SYSTEM MAP</text><text x="956" y="48" class="mono tiny muted" text-anchor="end">V1.1.0 · CURRENT IMPLEMENTATION</text>
<!-- status strip -->
<rect x="40" y="88" width="920" height="48" rx="9" fill="#171715" stroke="#383731"/>
<circle cx="62" cy="112" r="4" fill="#8da697" class="pulse"/><text x="76" y="116" class="mono tiny white">COORDINATOR</text><text x="200" y="116" class="mono tiny muted">JOB ROUTING</text><circle cx="335" cy="112" r="3" fill="#ed3426"/><text x="348" y="116" class="mono tiny muted">LEASED ATTEMPTS</text><circle cx="510" cy="112" r="3" fill="#eda231"/><text x="523" y="116" class="mono tiny muted">WORKER HEARTBEATS</text><circle cx="715" cy="112" r="3" fill="#8da697"/><text x="728" y="116" class="mono tiny muted">POSTGRESQL STATE</text>
<!-- client -->
<g class="float"><rect x="350" y="164" width="300" height="76" rx="12" class="card"/><rect x="350" y="164" width="5" height="76" rx="2" fill="#8da697"/><text x="500" y="194" text-anchor="middle" class="ui white" font-size="18" font-weight="800">CLI / CLIENT</text><text x="500" y="216" text-anchor="middle" class="mono tiny muted">SUBMIT JOB · INSPECT STATUS</text></g>
<path d="M500 240V285" class="line"/><circle r="5" class="packet"><animateMotion dur="1.7s" repeatCount="indefinite" path="M500 240V280"/></circle><text x="516" y="265" class="mono tiny muted">JOB REQUEST</text>
<!-- coordinator -->
<rect x="300" y="285" width="400" height="130" rx="14" fill="#202d25" stroke="#8da697" stroke-width="1.5"/><rect x="300" y="285" width="7" height="130" rx="3" fill="url(#sage)"/>
<text x="500" y="326" text-anchor="middle" class="ui white" font-size="23" font-weight="800">COORDINATOR</text><text x="500" y="350" text-anchor="middle" class="mono tiny" fill="#c9d8cc">HTTP API · SCHEDULER · ATTEMPT LEASES</text>
<rect x="335" y="369" width="96" height="25" rx="6" fill="#151514" stroke="#526b59"/><text x="383" y="385" text-anchor="middle" class="mono" font-size="8" fill="#c9d8cc">JOB STATE</text><rect x="452" y="369" width="96" height="25" rx="6" fill="#151514" stroke="#526b59"/><text x="500" y="385" text-anchor="middle" class="mono" font-size="8" fill="#c9d8cc">DISPATCH</text><rect x="569" y="369" width="96" height="25" rx="6" fill="#151514" stroke="#526b59"/><text x="617" y="385" text-anchor="middle" class="mono" font-size="8" fill="#c9d8cc">REGISTRY</text>
<!-- DB -->
<path d="M700 346H778" class="line"/><circle r="4" class="packet"><animateMotion dur="1.8s" repeatCount="indefinite" path="M700 346H773"/></circle>
<rect x="778" y="298" width="160" height="96" rx="12" class="card"/><ellipse cx="858" cy="316" rx="48" ry="9" fill="#26352b" stroke="#8da697"/><path d="M810 316v53c0 12 96 12 96 0v-53M810 342c0 12 96 12 96 0" fill="none" stroke="#8da697"/><text x="858" y="356" text-anchor="middle" class="ui white" font-size="13" font-weight="700">POSTGRESQL</text><text x="858" y="414" text-anchor="middle" class="mono" font-size="8" fill="#aaa99f">DURABLE STATE</text><text x="739" y="332" class="mono" font-size="8" fill="#aaa99f">PERSIST</text>
<!-- workers -->
<path d="M405 415C370 445 260 445 245 480" class="line"/><path d="M595 415C630 445 740 445 755 480" class="line"/>
<circle r="4.5" class="packet"><animateMotion dur="2.2s" repeatCount="indefinite" path="M405 415C370 445 260 445 245 480"/></circle><circle r="4.5" class="packet"><animateMotion dur="2.6s" begin=".8s" repeatCount="indefinite" path="M595 415C630 445 740 445 755 480"/></circle>
<text x="310" y="452" class="mono" font-size="8" fill="#aaa99f">DISPATCH / PULL</text><text x="690" y="452" class="mono" font-size="8" fill="#aaa99f">DISPATCH / PULL</text>
<g class="float"><rect x="95" y="480" width="300" height="104" rx="13" class="card"/><rect x="95" y="480" width="5" height="104" rx="2" fill="#ed3426"/><text x="245" y="516" text-anchor="middle" class="ui white" font-size="18" font-weight="800">WORKER A</text><text x="245" y="539" text-anchor="middle" class="mono tiny muted">PULL · EXECUTE · REPORT</text><rect x="170" y="553" width="150" height="17" rx="8" fill="#2b1b18"/><text x="245" y="565" text-anchor="middle" class="mono" font-size="8" fill="#ff9b8d">BOUNDED CONCURRENCY</text></g>
<g class="float"><rect x="605" y="480" width="300" height="104" rx="13" class="card"/><rect x="605" y="480" width="5" height="104" rx="2" fill="#ed3426"/><text x="755" y="516" text-anchor="middle" class="ui white" font-size="18" font-weight="800">WORKER B</text><text x="755" y="539" text-anchor="middle" class="mono tiny muted">PULL · EXECUTE · REPORT</text><rect x="680" y="553" width="150" height="17" rx="8" fill="#2b1b18"/><text x="755" y="565" text-anchor="middle" class="mono" font-size="8" fill="#ff9b8d">BOUNDED CONCURRENCY</text></g>
<!-- return signals -->
<path d="M260 480C290 448 390 448 450 415" fill="none" stroke="#eda231" stroke-width="1.7" stroke-dasharray="3 7"/><path d="M740 480C710 448 610 448 550 415" fill="none" stroke="#eda231" stroke-width="1.7" stroke-dasharray="3 7"/>
<circle r="3.5" fill="#eda231" filter="url(#glow)"><animateMotion dur="3s" repeatCount="indefinite" path="M260 480C290 448 390 448 450 415"/></circle><circle r="3.5" fill="#eda231" filter="url(#glow)"><animateMotion dur="3.4s" begin="1s" repeatCount="indefinite" path="M740 480C710 448 610 448 550 415"/></circle>
<text x="500" y="469" text-anchor="middle" class="mono tiny muted">HEARTBEATS + EXECUTION RESULTS</text>
<path d="M40 603H960" stroke="#383731"/><circle cx="54" cy="618" r="3" fill="#8da697"/><text x="66" y="622" class="mono" font-size="8" fill="#aaa99f">SUBMISSION / PERSISTENCE</text><circle cx="260" cy="618" r="3" fill="#eda231"/><text x="272" y="622" class="mono" font-size="8" fill="#aaa99f">DISPATCH / HEARTBEATS / RESULTS</text><text x="956" y="622" text-anchor="end" class="mono" font-size="8" fill="#77766f">ONE COORDINATOR · INDEPENDENT WORKERS</text>
</svg>