<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-labelledby="t d">
<title id="t">Neelesh Malakar — animated engineering dashboard</title><desc id="d">A dark operational dashboard portfolio with identity, MiniCloud status, animated engineering activity, capability metrics and an AI-inspired insight card.</desc>
<defs>
 <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#11110f"/><stop offset="1" stop-color="#070708"/></linearGradient>
 <linearGradient id="sage" x2="1" y2="1"><stop stop-color="#a8bcae"/><stop offset="1" stop-color="#718f7d"/></linearGradient>
 <linearGradient id="red" x2="1"><stop stop-color="#ff604e"/><stop offset="1" stop-color="#ed3426"/></linearGradient>
 <linearGradient id="chart" x2="0" y2="1"><stop stop-color="#ed3426" stop-opacity=".32"/><stop offset="1" stop-color="#ed3426" stop-opacity="0"/></linearGradient>
 <pattern id="grid" width="26" height="26" patternUnits="userSpaceOnUse"><path d="M26 0H0V26" fill="none" stroke="#302f2b" stroke-width=".6"/></pattern>
 <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feGaussianBlur in="SourceAlpha" stdDeviation="7"/><feOffset dy="4"/><feComponentTransfer><feFuncA type="linear" slope=".28"/></feComponentTransfer><feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge></filter>
 <style>
 .ui{font-family:Inter,Arial,sans-serif}.mono{font-family:Consolas,monospace}.white{fill:#fafaf9}.muted{fill:#aaa99f}.tiny{font-size:10px;letter-spacing:1.3px}.panel{fill:#151514;stroke:#383731}.pulse{animation:pulse 1.8s ease-in-out infinite}.float{animation:float 5s ease-in-out infinite}.float2{animation:float 6s ease-in-out -2s infinite}.draw{stroke-dasharray:520;stroke-dashoffset:520;animation:draw 3.2s ease forwards}.orbit{transform-origin:1025px 165px;animation:spin 16s linear infinite}
 @keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}@keyframes draw{to{stroke-dashoffset:0}}@keyframes spin{to{transform:rotate(360deg)}}
 @media(prefers-reduced-motion:reduce){.pulse,.float,.float2,.draw,.orbit{animation:none}}
 </style>
</defs>
<rect width="1200" height="560" rx="24" fill="url(#bg)"/><rect width="1200" height="560" rx="24" fill="url(#grid)" opacity=".6"/><rect x="1" y="1" width="1198" height="558" rx="23" fill="none" stroke="#4e4d44"/>
<rect x="20" y="18" width="1160" height="524" rx="18" fill="#0c0c0b" stroke="#383731"/>
<path d="M20 68H1180" stroke="#383731"/><circle cx="48" cy="43" r="5" fill="#ed3426"/><circle cx="66" cy="43" r="5" fill="#eda231"/><circle cx="84" cy="43" r="5" fill="#8da697"/>
<text x="108" y="47" class="mono tiny white">NEELESH / ENGINEERING OVERVIEW</text><text x="1148" y="47" text-anchor="end" class="mono tiny muted">PERSONAL WORKSPACE <tspan fill="#ed3426">●</tspan> ACTIVE</text>
<!-- identity -->
<text x="54" y="108" class="mono tiny" fill="#8da697">AI &amp; DATA SCIENCE · SOFTWARE ENGINEERING</text>
<text x="50" y="184" class="ui white" font-size="66" font-weight="850" letter-spacing="-4">NEELESH</text><text x="50" y="247" class="ui white" font-size="66" font-weight="850" letter-spacing="-4">MALAKAR<tspan fill="#ed3426">.</tspan></text>
<text x="55" y="284" class="ui" font-size="15" fill="#c6c4ba">Building practical software and exploring the systems</text><text x="55" y="307" class="ui" font-size="15" fill="#c6c4ba">that make it reliable, scalable and useful.</text>
<rect x="54" y="333" width="158" height="38" rx="8" fill="url(#red)"/><text x="133" y="357" class="mono tiny" fill="#fff" text-anchor="middle" font-weight="700">LET'S CONNECT ↗</text>
<rect x="222" y="333" width="152" height="38" rx="8" fill="#1a1a18" stroke="#4e4d44"/><text x="298" y="357" class="mono tiny white" text-anchor="middle">VIEW PROJECTS</text>
<text x="55" y="414" class="mono tiny muted">CORE INTERESTS</text>
<rect x="54" y="428" width="104" height="27" rx="13" fill="#202d25" stroke="#526b59"/><text x="106" y="446" class="mono" font-size="9" fill="#c9d8cc" text-anchor="middle">BACKEND</text>
<rect x="166" y="428" width="126" height="27" rx="13" fill="#2b1b18" stroke="#754036"/><text x="229" y="446" class="mono" font-size="9" fill="#ff9b8d" text-anchor="middle">DISTRIBUTED</text>
<rect x="300" y="428" width="104" height="27" rx="13" fill="#292820" stroke="#665a39"/><text x="352" y="446" class="mono" font-size="9" fill="#e7c98e" text-anchor="middle">APPLIED AI</text>
<text x="55" y="500" class="mono" font-size="9" fill="#77766f" letter-spacing="1">THINK CLEARLY · BUILD DELIBERATELY · KEEP ITERATING</text>
<!-- project focus -->
<g filter="url(#shadow)">
 <rect x="438" y="88" width="706" height="144" rx="14" class="panel"/>
 <text x="462" y="116" class="mono tiny muted">01 / CURRENTLY BUILDING</text><text x="462" y="154" class="ui white" font-size="29" font-weight="800">AWAITING SIGNAL</text>
 <text x="462" y="178" class="ui muted" font-size="12">10 qualifying commits in one India-local day</text>
 <rect x="462" y="195" width="96" height="22" rx="11" fill="#26352b"/><circle cx="475" cy="206" r="3" fill="#eda231" class="pulse"/><text x="485" y="210" class="mono" font-size="8" fill="#d2dfd5">WAITING</text>
 <g class="orbit"><circle cx="1025" cy="160" r="52" fill="none" stroke="#4e4d44" stroke-dasharray="3 7"/><circle cx="1025" cy="160" r="42" fill="none" stroke="#8da697" stroke-width="2" stroke-dasharray="75 190"/><circle cx="1025" cy="118" r="4" fill="#ed3426"/></g>
 <circle cx="1025" cy="160" r="28" fill="#202d25" stroke="#718f7d"/><path d="M1014 160h22m-11 -11v22" stroke="#c6d6ca" stroke-width="2" stroke-linecap="round"/>
 <text x="1105" y="210" class="mono" font-size="8" fill="#aaa99f" text-anchor="end">COORDINATE / EXECUTE / RECOVER</text>
</g>
<!-- dashboard cards -->
<g filter="url(#shadow)" class="float">
 <rect x="438" y="247" width="334" height="260" rx="14" fill="url(#sage)"/>
 <text x="462" y="278" class="mono tiny" fill="#26352c">02 / ENGINEERING PRINCIPLE</text>
 <text x="462" y="326" class="ui" font-size="28" font-weight="850" fill="#101511">BUILD WITH</text><text x="462" y="359" class="ui" font-size="28" font-weight="850" fill="#101511">INTENTION.</text>
 <text x="462" y="394" class="ui" font-size="13" fill="#24352c">Understand the trade-offs.</text><text x="462" y="415" class="ui" font-size="13" fill="#24352c">Design for failure cases.</text>
 <path d="M462 442H744" stroke="#536c5b"/><text x="462" y="466" class="mono" font-size="9" fill="#26352c">LESS HYPE · MORE ENGINEERING</text>
 <path d="M704 465l12 -13 9 6 14 -21" fill="none" stroke="#ed3426" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
</g>
<g filter="url(#shadow)" class="float2">
 <rect x="790" y="247" width="354" height="260" rx="14" class="panel"/>
 <text x="814" y="278" class="mono tiny muted">03 / BUILD ACTIVITY</text><text x="814" y="310" class="ui white" font-size="20" font-weight="800">Ideas into systems</text>
 <text x="1118" y="310" class="mono tiny" fill="#eda231" text-anchor="end">IN MOTION</text>
 <path d="M814 424H1118M814 386H1118M814 348H1118" stroke="#383731" stroke-dasharray="3 5"/>
 <path d="M814 411 C842 402 858 369 883 383 S923 417 948 374 S988 353 1010 368 S1050 340 1075 356 S1097 330 1118 337V424H814Z" fill="url(#chart)"/>
 <path d="M814 411 C842 402 858 369 883 383 S923 417 948 374 S988 353 1010 368 S1050 340 1075 356 S1097 330 1118 337" fill="none" stroke="#ed3426" stroke-width="3" stroke-linecap="round" class="draw"/>
 <circle cx="1118" cy="337" r="5" fill="#eda231" class="pulse"/>
 <text x="814" y="455" class="mono" font-size="9" fill="#aaa99f">BACKEND</text><text x="916" y="455" class="mono" font-size="9" fill="#aaa99f">SYSTEMS</text><text x="1020" y="455" class="mono" font-size="9" fill="#aaa99f">APPLIED AI</text>
 <rect x="814" y="472" width="304" height="4" rx="2" fill="#383731"/><rect x="814" y="472" width="198" height="4" rx="2" fill="#8da697"><animate attributeName="width" values="150;230;150" dur="5s" repeatCount="indefinite"/></rect>
</g>
<path d="M44 524H1156" stroke="#302f2b"/><text x="55" y="536" class="mono" font-size="8" fill="#77766f">PROFILE / 2026</text><text x="1145" y="536" text-anchor="end" class="mono" font-size="8" fill="#77766f">DESIGNED FOR CURIOSITY</text>
</svg>