<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="470" viewBox="0 0 1200 470" role="img" aria-labelledby="title desc">
<title id="title">Neelesh Malakar — builder dashboard</title>
<desc id="desc">A dark mobile-product-dashboard-inspired developer portfolio hero, with profile identity, project status, engineering focus cards, animated activity chart and AI-style insight panel.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#10100f"/><stop offset="1" stop-color="#070708"/></linearGradient>
  <linearGradient id="red" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#ff5945"/><stop offset="1" stop-color="#ed3426"/></linearGradient>
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feGaussianBlur in="SourceAlpha" stdDeviation="8"/><feOffset dy="5"/><feComponentTransfer><feFuncA type="linear" slope=".25"/></feComponentTransfer><feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <clipPath id="clip"><rect x="1" y="1" width="1198" height="468" rx="24"/></clipPath>
  <style>
    .ui{font-family:Inter,Arial,Helvetica,sans-serif}
    .mono{font-family:'SFMono-Regular',Consolas,monospace}
    .muted{fill:#aaa99f}
    .white{fill:#fafaf9}
    .tiny{font-size:10px;letter-spacing:1.4px}
    .panel{fill:#151514;stroke:#302f2b;stroke-width:1}
    .pulse{animation:pulse 1.8s ease-in-out infinite}
    .float{animation:float 4.8s ease-in-out infinite}
    .float2{animation:float 5.6s ease-in-out -2s infinite}
    .draw{stroke-dasharray:170;stroke-dashoffset:170;animation:draw 3s ease forwards}
    @keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
    @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
    @keyframes draw{to{stroke-dashoffset:0}}
    @media(prefers-reduced-motion:reduce){.pulse,.float,.float2,.draw{animation:none}}
  </style>
</defs>
<g clip-path="url(#clip)">
  <rect width="1200" height="470" fill="url(#bg)"/>
  <!-- app chrome -->
  <rect x="22" y="20" width="1156" height="430" rx="19" fill="#0c0c0b" stroke="#383731"/>
  <path d="M22 72H1178" stroke="#302f2b"/>
  <circle cx="51" cy="46" r="5" fill="#ed3426"/>
  <circle cx="69" cy="46" r="5" fill="#eda231"/>
  <circle cx="87" cy="46" r="5" fill="#8da697"/>
  <text x="112" y="50" class="mono tiny white">NEELESH / BUILDER DASHBOARD</text>
  <text x="1147" y="50" class="mono tiny muted" text-anchor="end">PERSONAL PORTFOLIO <tspan fill="#ed3426">●</tspan> LIVE</text>
  <!-- main left identity -->
  <text x="57" y="111" class="ui tiny" fill="#8da697" font-weight="700">GOOD TO SEE YOU HERE 👋</text>
  <text x="54" y="178" class="ui white" font-size="62" font-weight="850" letter-spacing="-3.5">NEELESH</text>
  <text x="54" y="237" class="ui white" font-size="62" font-weight="850" letter-spacing="-3.5">MALAKAR<tspan fill="#ed3426">.</tspan></text>
  <text x="58" y="273" class="ui" font-size="15" fill="#c6c4ba">AI &amp; Data Science student building across</text>
  <text x="58" y="296" class="ui" font-size="15" fill="#c6c4ba">software engineering, systems and applied AI.</text>
  <rect x="57" y="319" width="179" height="37" rx="9" fill="url(#red)"/>
  <text x="146" y="343" class="mono tiny" text-anchor="middle" fill="#fff" font-weight="700">LET'S BUILD ↗</text>
  <rect x="246" y="319" width="151" height="37" rx="9" fill="#1c1c1a" stroke="#45443e"/>
  <text x="321" y="343" class="mono tiny" text-anchor="middle" fill="#e8e6dd">VIEW PROJECTS</text>
  <text x="58" y="397" class="mono tiny muted">FOCUS AREAS</text>
  <rect x="58" y="408" width="114" height="24" rx="12" fill="#202d25" stroke="#455e4c"/>
  <text x="115" y="424" class="mono" font-size="9" fill="#b4c9b7" text-anchor="middle">BACKEND</text>
  <rect x="180" y="408" width="123" height="24" rx="12" fill="#2b1a18" stroke="#71342c"/>
  <text x="241" y="424" class="mono" font-size="9" fill="#ff9b8d" text-anchor="middle">DISTRIBUTED</text>
  <rect x="311" y="408" width="106" height="24" rx="12" fill="#1c1d43" stroke="#4245a0"/>
  <text x="364" y="424" class="mono" font-size="9" fill="#b9baff" text-anchor="middle">APPLIED AI</text>
  <!-- right dashboard column -->
  <g filter="url(#shadow)">
    <rect x="452" y="91" width="686" height="106" rx="14" class="panel"/>
    <text x="476" y="119" class="mono tiny muted">01 / CURRENTLY BUILDING</text>
    <text x="476" y="155" class="ui white" font-size="27" font-weight="800">MINICLOUD</text>
    <text x="476" y="176" class="ui muted" font-size="12">Distributed job execution · Go · PostgreSQL</text>
    <rect x="991" y="110" width="122" height="27" rx="13.5" fill="#24352a"/>
    <circle cx="1008" cy="123.5" r="4" fill="#8da697" class="pulse"/>
    <text x="1020" y="127" class="mono" font-size="9" fill="#c5d6c8">IN PROGRESS</text>
    <path d="M1000 163H1110" stroke="#3a3933" stroke-width="5" stroke-linecap="round"/>
    <path d="M1000 163H1076" stroke="#ed3426" stroke-width="5" stroke-linecap="round"><animate attributeName="stroke-dasharray" values="0 110;76 110;0 110" dur="4s" repeatCount="indefinite"/></path>
  </g>
  <!-- insight panel -->
  <g filter="url(#shadow)" class="float">
    <rect x="452" y="211" width="326" height="211" rx="14" fill="#8da697"/>
    <text x="475" y="240" class="mono tiny" fill="#26352c">02 / ENGINEERING MINDSET</text>
    <text x="475" y="283" class="ui" font-size="29" font-weight="850" fill="#101511">BUILD WITH</text>
    <text x="475" y="317" class="ui" font-size="29" font-weight="850" fill="#101511">INTENTION.</text>
    <text x="475" y="348" class="ui" font-size="13" fill="#24352c">Understand the trade-offs.</text>
    <text x="475" y="368" class="ui" font-size="13" fill="#24352c">Design for the failure cases.</text>
    <path d="M475 390H751" stroke="#536c5b" opacity=".65"/>
    <text x="475" y="408" class="mono" font-size="9" fill="#26352c">LESS HYPE · MORE ENGINEERING</text>
    <path d="M716 388l14 -14 10 7 13 -20" fill="none" stroke="#ed3426" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <!-- activity chart card -->
  <g filter="url(#shadow)" class="float2">
    <rect x="796" y="211" width="342" height="211" rx="14" class="panel"/>
    <text x="820" y="240" class="mono tiny muted">03 / WHAT I'M INTO</text>
    <text x="820" y="270" class="ui white" font-size="20" font-weight="800">Curiosity → Projects</text>
    <text x="1113" y="270" class="mono tiny" fill="#eda231" text-anchor="end">ALWAYS ON</text>
    <path d="M820 370H1114M820 333H1114M820 296H1114" stroke="#383731" stroke-dasharray="3 5"/>
    <path d="M820 355 C850 350 855 318 882 329 S925 360 948 322 S987 302 1009 316 S1052 291 1074 307 S1096 283 1114 290" fill="none" stroke="#ed3426" stroke-width="3" stroke-linecap="round" class="draw"/>
    <path d="M820 355 C850 350 855 318 882 329 S925 360 948 322 S987 302 1009 316 S1052 291 1074 307 S1096 283 1114 290V370H820Z" fill="#ed3426" opacity=".10"/>
    <circle cx="1114" cy="290" r="5" fill="#eda231" class="pulse"/>
    <text x="820" y="397" class="mono" font-size="9" fill="#aaa99f">BACKEND</text>
    <text x="922" y="397" class="mono" font-size="9" fill="#aaa99f">SYSTEMS</text>
    <text x="1024" y="397" class="mono" font-size="9" fill="#aaa99f">AI TOOLS</text>
  </g>
  <!-- footer strip -->
  <path d="M44 438H1156" stroke="#302f2b"/>
  <text x="57" y="448" class="mono" font-size="8" fill="#77766f" letter-spacing="1.1">THINK · BUILD · TEST · ITERATE</text>
  <text x="1140" y="448" class="mono" font-size="8" fill="#77766f" text-anchor="end" letter-spacing="1.1">DESIGNED FOR CURIOSITY</text>
</g>
<rect x="1" y="1" width="1198" height="468" rx="24" fill="none" stroke="#393832"/>
</svg>