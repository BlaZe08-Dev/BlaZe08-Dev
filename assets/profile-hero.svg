<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="430" viewBox="0 0 1200 430" role="img" aria-labelledby="title desc">
<title id="title">Neelesh Malakar — creative engineering profile</title>
<desc id="desc">A bold dark editorial dashboard-inspired profile hero with oversized typography, colorful modular tiles, animated data lines and a live build indicator.</desc>
<defs>
  <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="1.5" cy="1.5" r="1" fill="#77766f" opacity=".22"/></pattern>
  <linearGradient id="red" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#ff513b"/><stop offset="1" stop-color="#d92319"/></linearGradient>
  <linearGradient id="sage" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#b4c9b7"/><stop offset="1" stop-color="#718e7d"/></linearGradient>
  <filter id="shadow" x="-30%" y="-30%" width="160%" height="170%"><feGaussianBlur in="SourceAlpha" stdDeviation="8"/><feOffset dy="7"/><feComponentTransfer><feFuncA type="linear" slope=".3"/></feComponentTransfer><feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <clipPath id="frame"><rect x="1" y="1" width="1198" height="428" rx="26"/></clipPath>
  <style>
    .sans{font-family:Inter,Arial,Helvetica,sans-serif}
    .mono{font-family:'SFMono-Regular',Consolas,monospace}
    .tiny{font-size:10px;letter-spacing:1.6px}
    .float{animation:float 5s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
    .float2{animation:float 6s ease-in-out -2s infinite;transform-box:fill-box;transform-origin:center}
    .blink{animation:blink 1.8s ease-in-out infinite}
    .dash{stroke-dasharray:5 9;animation:dash 8s linear infinite}
    .bar{transform-box:fill-box;transform-origin:bottom;animation:grow 2.4s ease-in-out infinite alternate}
    @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
    @keyframes blink{0%,100%{opacity:1}50%{opacity:.28}}
    @keyframes dash{to{stroke-dashoffset:-140}}
    @keyframes grow{from{transform:scaleY(.45)}to{transform:scaleY(1)}}
    @media(prefers-reduced-motion:reduce){.float,.float2,.blink,.dash,.bar{animation:none}}
  </style>
</defs>
<g clip-path="url(#frame)">
  <rect width="1200" height="430" fill="#070708"/>
  <rect width="1200" height="430" fill="url(#dots)"/>
  <path d="M0 0H1200V430H0Z" fill="none" stroke="#292927"/>
  <text x="48" y="43" class="mono tiny" fill="#aaa99f">NEELESH MALAKAR <tspan fill="#ed3426">/</tspan> PERSONAL SPACE</text>
  <text x="1152" y="43" class="mono tiny" text-anchor="end" fill="#aaa99f">INDEPENDENTLY CURIOUS · ALWAYS IN BETA</text>
  <path d="M48 59H1152" stroke="#383834"/>
  <!-- headline -->
  <text x="58" y="139" class="sans" font-size="23" font-weight="700" fill="#f4f2ec" letter-spacing="-1">HEY, I'M</text>
  <text x="52" y="225" class="sans" font-size="88" font-weight="900" fill="#f7f5ef" letter-spacing="-5">NEELESH</text>
  <text x="55" y="305" class="sans" font-size="82" font-weight="900" fill="#f7f5ef" letter-spacing="-5">MALAKAR<span fill="#ed3426">.</span></text>
  <rect x="58" y="329" width="310" height="39" rx="19.5" fill="#ed3426"/>
  <text x="213" y="354" class="mono" font-size="12" font-weight="700" text-anchor="middle" fill="#fff">I BUILD THINGS THAT DO THINGS ↗</text>
  <text x="59" y="397" class="sans" font-size="14" fill="#aaa99f">AI &amp; Data Science student · Software / Systems / Applied AI</text>
  <!-- top right small status -->
  <g transform="translate(900 78)">
    <rect width="252" height="45" rx="12" fill="#151515" stroke="#333330"/>
    <circle cx="21" cy="22" r="5" fill="#8da697" class="blink"/>
    <text x="37" y="19" class="mono tiny" fill="#b8c8bb">CURRENTLY BUILDING</text>
    <text x="37" y="34" class="sans" font-size="13" font-weight="700" fill="#f4f2ec">MINICLOUD <tspan fill="#ed3426">↗</tspan></text>
  </g>
  <!-- modular tiles, dashboard-inspired -->
  <g filter="url(#shadow)" class="float">
    <rect x="840" y="151" width="312" height="133" rx="18" fill="url(#sage)"/>
    <text x="862" y="179" class="mono tiny" fill="#1d3026">01 / SYSTEMS THINKING</text>
    <text x="862" y="219" class="sans" font-size="27" font-weight="800" fill="#101b15">MAKE IT WORK.</text>
    <text x="862" y="249" class="sans" font-size="27" font-weight="800" fill="#101b15">KNOW WHY.</text>
    <path d="M1078 253l17 -18 12 8 24 -33" fill="none" stroke="#1d4934" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="1131" cy="210" r="4" fill="#ed3426"/>
  </g>
  <g filter="url(#shadow)" class="float2">
    <rect x="739" y="303" width="195" height="93" rx="16" fill="#ed3426"/>
    <text x="758" y="328" class="mono tiny" fill="#ffe0d9">02 / CURRENT MODE</text>
    <text x="758" y="358" class="sans" font-size="22" font-weight="900" fill="#fff">BUILD</text>
    <text x="758" y="378" class="sans" font-size="22" font-weight="900" fill="#fff">→ REPEAT</text>
  </g>
  <g filter="url(#shadow)" class="float">
    <rect x="951" y="303" width="201" height="93" rx="16" fill="#2f32fe"/>
    <text x="970" y="328" class="mono tiny" fill="#d9d9ff">03 / TOOLBOX</text>
    <text x="970" y="357" class="sans" font-size="18" font-weight="800" fill="#fff">GO · PYTHON</text>
    <text x="970" y="378" class="sans" font-size="18" font-weight="800" fill="#fff">SYSTEMS · AI</text>
    <circle cx="1124" cy="324" r="5" fill="#eda231" class="blink"/>
  </g>
  <!-- tiny data visualization -->
  <g transform="translate(785 145)">
    <path d="M0 0H340" stroke="#ffffff" opacity=".08"/>
    <path d="M0 12H340" stroke="#ffffff" opacity=".08"/>
  </g>
  <g transform="translate(765 269)" opacity=".9">
    <rect x="0" y="0" width="7" height="17" rx="3" fill="#eda231" class="bar"/>
    <rect x="13" y="5" width="7" height="12" rx="3" fill="#eda231" class="bar" style="animation-delay:-.4s"/>
    <rect x="26" y="1" width="7" height="16" rx="3" fill="#eda231" class="bar" style="animation-delay:-.8s"/>
    <rect x="39" y="8" width="7" height="9" rx="3" fill="#eda231" class="bar" style="animation-delay:-1.2s"/>
  </g>
  <path d="M48 413H1152" stroke="#383834"/>
  <text x="48" y="424" class="mono" font-size="8" fill="#77766f" letter-spacing="1.5">DESIGNING · DEBUGGING · DEPLOYING</text>
  <text x="1152" y="424" class="mono" font-size="8" fill="#77766f" text-anchor="end" letter-spacing="1.5">EST. IN CURIOSITY / BUILT WITH INTENT</text>
</g>
<rect x="1" y="1" width="1198" height="428" rx="26" fill="none" stroke="#373633" stroke-width="1.5"/>
</svg>