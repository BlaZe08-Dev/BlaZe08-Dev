<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="270" viewBox="0 0 1000 270" role="img" aria-labelledby="t d">
<title id="t">878 all-time GitHub commits</title><desc id="d">Animated contribution dashboard with visible all-time commit count, rotating activity ring, pulse chart and animated progress indicators.</desc>
<defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#10100f"/><stop offset=".6" stop-color="#151514"/><stop offset="1" stop-color="#070708"/></linearGradient><linearGradient id="num"><stop stop-color="#fafaf9"/><stop offset=".55" stop-color="#8da697"/><stop offset="1" stop-color="#eda231"/></linearGradient><pattern id="grid" width="26" height="26" patternUnits="userSpaceOnUse"><path d="M26 0H0V26" fill="none" stroke="#302f2b" stroke-width=".6"/></pattern><filter id="glow" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter><style>.m{font-family:Consolas,monospace}.tiny{font-size:10px;letter-spacing:1.1px}.muted{fill:#aaa99f}.pulse{animation:pulse 1.8s ease-in-out infinite}.spin{transform-origin:533px 148px;animation:spin 12s linear infinite}@keyframes pulse{50%{opacity:.25}}@keyframes spin{to{transform:rotate(360deg)}}@media(prefers-reduced-motion:reduce){.pulse,.spin{animation:none}}</style></defs>
<rect width="1000" height="270" rx="18" fill="url(#bg)"/><rect width="1000" height="270" rx="18" fill="url(#grid)" opacity=".5"/><rect x="1" y="1" width="998" height="268" rx="17" fill="none" stroke="#4e4d44"/>
<text x="32" y="34" class="m tiny" fill="#8da697">04 / CONTRIBUTION TELEMETRY</text><text x="968" y="34" text-anchor="end" class="m tiny muted">GITHUB ACTIVITY OVERVIEW</text>
<rect x="25" y="53" width="355" height="190" rx="12" fill="#151514" stroke="#4e4d44"/><text x="49" y="83" class="m tiny muted">ALL-TIME COMMITS</text><text x="43" y="181" font-family="Inter,Arial,sans-serif" font-size="100" font-weight="850" letter-spacing="-7" fill="url(#num)">878</text><text x="52" y="211" class="m tiny" fill="#8da697">ACROSS ALL YEARS</text><path d="M50 226H350" stroke="#383731"/><path d="M50 226H350" stroke="#ed3426" stroke-width="2" stroke-dasharray="18 282"><animate attributeName="stroke-dashoffset" values="0;-300" dur="5s" repeatCount="indefinite"/></path>
<rect x="398" y="53" width="270" height="190" rx="12" fill="#151514" stroke="#4e4d44"/><text x="422" y="83" class="m tiny muted">ACTIVITY PULSE</text><circle cx="533" cy="148" r="65" fill="none" stroke="#383731" stroke-width="10"/><circle cx="533" cy="148" r="65" fill="none" stroke="#8da697" stroke-width="3" stroke-dasharray="120 290" stroke-linecap="round" class="spin"/><circle cx="533" cy="148" r="49" fill="none" stroke="#4e4d44" stroke-dasharray="2 7"/><text x="533" y="145" text-anchor="middle" class="m" fill="#fafaf9" font-size="25">●</text><text x="533" y="166" text-anchor="middle" class="m tiny muted">BUILD</text><circle cx="533" cy="83" r="4" fill="#ed3426" class="pulse"/><text x="533" y="225" text-anchor="middle" class="m" font-size="8" fill="#aaa99f">CONSISTENCY OVER SPIKES</text>
<rect x="686" y="53" width="289" height="190" rx="12" fill="#151514" stroke="#4e4d44"/><text x="710" y="83" class="m tiny muted">ENGINEERING RHYTHM</text><path d="M710 190H950M710 155H950M710 120H950" stroke="#383731" stroke-dasharray="3 5"/><path d="M710 177C733 170 744 134 768 145S800 188 824 150S864 129 884 143S922 113 950 124" fill="none" stroke="#ed3426" stroke-width="2.5" stroke-linecap="round"/><path d="M710 177C733 170 744 134 768 145S800 188 824 150S864 129 884 143S922 113 950 124" fill="none" stroke="#eda231" stroke-width="2" stroke-dasharray="2 12" filter="url(#glow)"><animate attributeName="stroke-dashoffset" values="0;-56" dur="2.4s" repeatCount="indefinite"/></path><circle cx="950" cy="124" r="4" fill="#eda231" class="pulse"/><text x="710" y="218" class="m" font-size="8" fill="#aaa99f">CODE · LEARN · SHIP · REPEAT</text>
