<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="150" viewBox="0 0 1000 150" role="img" aria-labelledby="title desc">
<title id="title">Animated all-time commit telemetry</title>
<desc id="desc">A neon green animated commit activity waveform with flowing pulses and an all-time commit counter label. The live total is shown in the GitHub statistics card below.</desc>
<defs>
 <linearGradient id="bg" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#030806"/><stop offset=".5" stop-color="#092015"/><stop offset="1" stop-color="#030806"/></linearGradient>
 <linearGradient id="line" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#00ff88" stop-opacity=".1"/><stop offset=".5" stop-color="#00ff88"/><stop offset="1" stop-color="#00ff88" stop-opacity=".1"/></linearGradient>
 <filter id="glow" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
 <pattern id="grid" width="25" height="25" patternUnits="userSpaceOnUse"><path d="M25 0H0V25" stroke="#174a31" stroke-width=".7" fill="none"/></pattern>
</defs>
<rect width="1000" height="150" rx="14" fill="url(#bg)"/>
<rect width="1000" height="150" rx="14" fill="url(#grid)" opacity=".55"/>
<rect x="1" y="1" width="998" height="148" rx="13" fill="none" stroke="#17613c"/>
<path d="M32 38H968M32 112H968" stroke="#174a31" stroke-width="1"/>
<text x="42" y="29" font-family="monospace" font-size="11" letter-spacing="2.4" fill="#7ca991">CONTRIBUTION TELEMETRY / STREAM 001</text>
<text x="42" y="77" font-family="monospace" font-size="25" font-weight="700" letter-spacing="1" fill="#e5fff0">ALL-TIME COMMIT COUNT</text>
<text x="43" y="99" font-family="monospace" font-size="10" letter-spacing="1.8" fill="#79b993">LIVE TOTAL · ALL YEARS · GITHUB STATISTICS</text>
<g transform="translate(600 76)">
 <path d="M0 0h35l12 -18 12 36 14 -28 14 10h26l12 -8 12 16 12 -24 12 16h34l12 -10 12 20 12 -14h32l12 -8 12 16 12 -24 12 18h34l12 -12 12 22 12 -17h40" fill="none" stroke="#167a49" stroke-width="2"/>
 <path d="M0 0h35l12 -18 12 36 14 -28 14 10h26l12 -8 12 16 12 -24 12 16h34l12 -10 12 20 12 -14h32l12 -8 12 16 12 -24 12 18h34l12 -12 12 22 12 -17h40" fill="none" stroke="url(#line)" stroke-width="2.5" stroke-dasharray="2 12" filter="url(#glow)">
  <animate attributeName="stroke-dashoffset" values="0;-112" dur="3s" repeatCount="indefinite"/>
 </path>
 <circle cx="0" cy="0" r="4" fill="#00ff88" filter="url(#glow)"><animate attributeName="opacity" values=".25;1;.25" dur="1.4s" repeatCount="indefinite"/></circle>
 <circle cx="365" cy="0" r="4" fill="#00ff88" filter="url(#glow)"><animate attributeName="opacity" values="1;.2;1" dur="1.8s" repeatCount="indefinite"/></circle>
</g>
<rect x="42" y="122" width="916" height="2" rx="1" fill="#174a31"/>
<rect x="42" y="122" width="210" height="2" rx="1" fill="#00ff88"><animate attributeName="width" values="80;916;80" dur="5s" repeatCount="indefinite"/></rect>
<circle cx="957" cy="29" r="4" fill="#00ff88" filter="url(#glow)"><animate attributeName="opacity" values="1;.25;1" dur="1.2s" repeatCount="indefinite"/></circle>
</svg>